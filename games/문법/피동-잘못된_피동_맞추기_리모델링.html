            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
            play(freq, type, duration, vol = 0.1) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + duration);
            },

        /* ─── canvas roundRect 호환 헬퍼 ─── */
        function drawRoundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }
        function roundBox(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

                if (text.length <= 12) return [text];
                const words = text.split(' ');
                let mid = Math.ceil(words.length / 2);
                return [words.slice(0, mid).join(' '), words.slice(mid).join(' ')];
            };

                    state.current.keys[e.key] = true;

                        state.current.bullets.push({ x: state.current.playerX + 30, y: CONFIG.HEIGHT - 85 });

                    }
                };
                const handleKeyUp = (e) => state.current.keys[e.key] = false;
                window.addEventListener('keydown', handleKeyDown);

                const ctx = canvasRef.current.getContext('2d');
                let frame;
                const spawnInterval = difficulty === 'hard' ? 2000 : 3500;
                const fallSpeed = difficulty === 'hard' ? 55 : 35;

                const loop = () => {
                    const now = Date.now();
                    const s = state.current;
                    if (s.isFirst) {
                        for (let i = 0; i < CONFIG.INITIAL_SPAWN; i++) spawn(50 + i * 260);
                        s.isFirst = false; s.lastSpawn = now;
                    } else if (now - s.lastSpawn > spawnInterval) {
                        const sections = [50, 800, 300, 550];
                        spawn(sections[s.spawnStep % 4] + Math.random() * 50);
                        s.spawnStep++; s.lastSpawn = now;
                    }

                    function spawn(x) {
                        const isIncorrect = Math.random() > 0.45;
                        const dataPool = isIncorrect ? incorrectKeys : correctData;
                        let fullText = dataPool[Math.floor(Math.random() * dataPool.length)];
                        let retry = 0;
                        while (s.recentTexts.includes(fullText) && retry < 10) {
                            fullText = dataPool[Math.floor(Math.random() * dataPool.length)]; retry++;
                        }
                        s.recentTexts.push(fullText);
                        if (s.recentTexts.length > 5) s.recentTexts.shift();
                        const lines = splitTextBySpace(fullText);
                        s.balloons.push({ x, y: -100, lines, isTarget: isIncorrect, w: 220, h: lines.length > 1 ? 85 : 65, color: CONFIG.COLORS[s.colorIndex % 4] });
                        s.colorIndex++;
                    }

                    if (s.keys['ArrowLeft']) s.playerX = Math.max(0, s.playerX - CONFIG.CANNON_SPEED * 0.016);
                    if (s.keys['ArrowRight']) s.playerX = Math.min(CONFIG.WIDTH - 60, s.playerX + CONFIG.CANNON_SPEED * 0.016);
                    s.bullets.forEach(b => b.y -= CONFIG.BULLET_SPEED * 0.016);
                    s.balloons.forEach(b => b.y += fallSpeed * 0.016);

                    /* 화면 밖으로 나간 풍선 */
                    for (let idx = s.balloons.length - 1; idx >= 0; idx--) {
                        const bal = s.balloons[idx];
                        if (bal.y > CONFIG.HEIGHT) {
                            if (bal.isTarget) {
                                s.combo = 0; s.totalMissed++;
                                setUi(u => ({ ...u, lives: u.lives - 1, combo: 0 }));
                                showPopBanner('놓쳤어요! ⚠️', bal.x + bal.w / 2, CONFIG.HEIGHT - 50, false);
                                const txt = bal.lines.join(' ');
                                if (!s.wrongAnswers.some(wa => wa.text === txt)) {
                                    s.wrongAnswers.push({ text: txt, isTarget: true, fix: incorrectDataMap[txt], action: 'missed' });
                                }
                                Sound.wrong();
                            }
                            s.balloons.splice(idx, 1);
                        }
                    }

                    /* 충돌 판정 */
                    for (let bIdx = s.bullets.length - 1; bIdx >= 0; bIdx--) {
                        const bull = s.bullets[bIdx];
                        if (bull.y < -10) { s.bullets.splice(bIdx, 1); continue; }
                        for (let idx = s.balloons.length - 1; idx >= 0; idx--) {
                            const bal = s.balloons[idx];
                            if (bull.x > bal.x && bull.x < bal.x + bal.w && bull.y > bal.y && bull.y < bal.y + bal.h) {
                                s.bullets.splice(bIdx, 1);
                                s.balloons.splice(idx, 1);
                                if (bal.isTarget) {
                                    s.combo++; s.totalCorrect++;
                                    if (s.combo > s.maxCombo) s.maxCombo = s.combo;
                                    let pts = 10;
                                    let bonusText = '';
                                    if (s.combo >= 5) { pts += 10; bonusText = ' +10 콤보!'; Sound.combo(); }
                                    else if (s.combo >= 3) { pts += 5; bonusText = ' +5 콤보!'; Sound.combo(); }
                                    setUi(u => ({ ...u, score: u.score + pts, combo: s.combo, maxCombo: s.maxCombo }));
                                    showPopBanner('정답! +' + pts + '점' + bonusText, bal.x + bal.w / 2, bal.y + bal.h / 2, true);
                                    Sound.correct();
                                } else {
                                    s.combo = 0; s.totalWrong++;
                                    const txt = bal.lines.join(' ');
                                    setUi(u => ({ ...u, score: Math.max(0, u.score - 5), lives: u.lives - 1, combo: 0 }));
                                    showPopBanner('올바른 표현! -5점', bal.x + bal.w / 2, bal.y + bal.h / 2, false);
                                    if (!s.wrongAnswers.some(wa => wa.text === txt)) {
                                        s.wrongAnswers.push({ text: txt, isTarget: false, action: 'wrongShot' });
                                    }
                                    Sound.wrong();
                                }
                                break;
                            }
                        }
                    }

                    /* 그리기 */
                    ctx.clearRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);
                    /* 대포 */
                    ctx.save(); ctx.translate(s.playerX + 30, CONFIG.HEIGHT - 20);
                    ctx.fillStyle = '#4c1d95';
                    ctx.beginPath(); ctx.ellipse(0, 0, 45, 25, 0, Math.PI, 0); ctx.fill();
                    ctx.fillStyle = '#6d28d9';
                    drawRoundRect(ctx, -15, -65, 30, 50, 10); ctx.fill();
                    ctx.fillStyle = '#8b5cf6';
                    drawRoundRect(ctx, -18, -75, 36, 12, 5); ctx.fill();
                    ctx.restore();
                    /* 풍선 */
                    s.balloons.forEach(b => {
                        ctx.fillStyle = b.color;
                        drawRoundRect(ctx, b.x, b.y, b.w, b.h, 25); ctx.fill();
                        ctx.beginPath(); ctx.moveTo(b.x + b.w / 2 - 5, b.y + b.h); ctx.lineTo(b.x + b.w / 2 + 5, b.y + b.h); ctx.lineTo(b.x + b.w / 2, b.y + b.h + 10); ctx.fill();
                        ctx.fillStyle = '#1e293b'; ctx.font = 'bold 15px "Noto Sans KR", sans-serif'; ctx.textAlign = 'center';
                        b.lines.forEach((line, i) => ctx.fillText(line, b.x + b.w / 2, b.y + (b.h / (b.lines.length + 1)) * (i + 1) + 5));
                    });
                    /* 총알 */
                    ctx.fillStyle = '#a855f7';
                    s.bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 7, 0, Math.PI * 2); ctx.fill(); });

                    if (ui.lives <= 0) {
                        onEnd(ui.score, s.wrongAnswers, { combo: s.maxCombo, correct: s.totalCorrect, wrong: s.totalWrong, missed: s.totalMissed });
                        return;
                    }
                    frame = requestAnimationFrame(loop);
                };
                frame = requestAnimationFrame(loop);
                return () => cancelAnimationFrame(frame);
            }, [onEnd, ui.lives, difficulty]);

                                    [9국04-05] 피동 표현과 인용 표현의 의도와 효과를 분석하고 상황에 맞게 활용한다.
                                </div>

                                {/* 2단 레이아웃: 게임방법 + 점수규칙 */}
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
                                    <div className="bg-sky-50 border border-sky-200 rounded-xl p-4">
                                        <h3 className="font-bold text-sky-800 mb-2 text-sm">🎮 게임 방법</h3>
                                        <div className="text-sm text-sky-700 leading-6">
                                            <strong>←→</strong> 방향키로 대포를 좌우로 이동합니다.<br/>
                                            <strong>스페이스바</strong>를 눌러 총알을 발사합니다.<br/>
                                            <strong>잘못된 피동 표현</strong>이 쓰인 풍선만 맞추세요!
                                        </div>
                                    </div>
                                    <div className="bg-amber-50 border border-amber-200 rounded-xl p-4">
                                        <h3 className="font-bold text-amber-800 mb-2 text-sm">🏅 점수 규칙</h3>
                                        <div className="text-sm text-amber-700 leading-6">
                                            정답 적중 <strong>+10점</strong><br/>
                                            3연속 콤보 보너스 <strong>+5점</strong><br/>
                                            5연속 콤보 보너스 <strong>+10점</strong><br/>
                                            올바른 표현 오발사 <strong>-5점</strong>
                                        </div>
                                    </div>
                                </div>

                                {/* 난이도 선택 */}
                                <div className="bg-slate-50 border border-slate-200 rounded-xl p-4 mb-4">
                                    <h3 className="font-bold text-slate-700 mb-3 text-sm text-center">🎯 난이도를 선택하세요</h3>
                                    <div className="flex gap-4 justify-center">
                                        <button onClick={() => handleStart('easy')} className="flex-1 max-w-[200px] py-5 bg-gradient-to-br from-emerald-400 to-teal-500 text-white text-xl font-black rounded-2xl hover:scale-105 transition-all shadow-lg active:scale-95">
                                            <div className="text-2xl mb-1">🌱</div>초급
                                            <div className="text-xs opacity-80 mt-1 font-medium">느린 속도 · 적은 풍선</div>
                                        </button>
                                        <button onClick={() => handleStart('hard')} className="flex-1 max-w-[200px] py-5 bg-gradient-to-br from-rose-400 to-pink-500 text-white text-xl font-black rounded-2xl hover:scale-105 transition-all shadow-lg active:scale-95">
                                            <div className="text-2xl mb-1">🔥</div>고급
                                            <div className="text-xs opacity-80 mt-1 font-medium">빠른 속도 · 많은 풍선</div>
                                        </button>
                                    </div>
                                </div>

                                {/* 크레딧 */}
                                <div className="text-center text-xs text-slate-400 pt-3 border-t border-slate-200 leading-6">
                                    제작 · 보라라샘 · 전주서신중학교 교사 · siaawase@gmail.com<br/>
                                    제작일 2026.04.14 · Made with Claude
                                </div>
                            </div>

                            {/* 개인정보 보호 안내 */}
                            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 text-xs text-slate-400 leading-5">
                                🔒 <strong className="text-slate-500">개인정보 보호 안내</strong><br/>
                                본 게임은 별도의 서버로 데이터를 전송하거나 저장하지 않습니다. 게임 중 입력하는 이름, 활동 소감 등의 정보는 오직 사용자 기기 내부에서 리포트 이미지를 다운로드하는 용도로만 안전하게 처리됩니다.
                            </div>
                        </div>
                    )}

                    {scene === 'play' && (
                        <div className="flex flex-col items-center min-h-screen justify-center">
                            <Game difficulty={difficulty} onEnd={handleEnd} />
                        </div>
                    )}

                    {scene === 'end' && (
                        <div className="max-w-4xl mx-auto px-4 py-6">
                            <div className="bg-white rounded-3xl shadow-xl border border-purple-100 p-8">
                                {/* 결과 헤더 */}
                                <div className="text-center mb-6">
                                    <p className="text-sm font-bold text-purple-400 uppercase tracking-widest mb-2">🏆 게임 종료 · {diffLabel}</p>
                                    <div className="text-5xl font-black text-purple-600 mb-2">{score}점</div>
                                    <div className="flex justify-center gap-4 text-sm text-slate-500">
                                        <span>정답 적중 <strong className="text-emerald-600">{stats.correct}</strong>회</span>
                                        <span>오발사 <strong className="text-rose-500">{stats.wrong}</strong>회</span>
                                        <span>놓침 <strong className="text-orange-500">{stats.missed}</strong>회</span>
                                        <span>최고 콤보 <strong className="text-purple-600">{stats.combo}</strong></span>
                                    </div>
                                </div>

                                {/* 이름 + 소감 입력 */}
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-1">✏️ 이름 <span className="text-rose-400">*</span></label>
                                        <input id="name-input" type="text" placeholder="이름을 입력하세요" maxLength="20"
                                            className="w-full px-4 py-3 border-2 border-purple-200 rounded-xl text-sm focus:outline-none focus:border-purple-400 transition-colors" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-1">💬 학습 소감 <span className="text-rose-400">*</span></label>
                                        <textarea id="reflection-input" placeholder="오늘 학습한 소감을 적어보세요" maxLength="200" rows="2"
                                            className="w-full px-4 py-3 border-2 border-purple-200 rounded-xl text-sm focus:outline-none focus:border-purple-400 transition-colors resize-none" />
                                    </div>
                                </div>

                                {/* 복습하기 */}
                                <div className="bg-slate-50 rounded-2xl p-5 mb-6 border border-slate-100">
                                    <h3 className="text-base font-black text-slate-700 mb-3">📖 이번 게임 복습하기</h3>
                                    {reviewList.length > 0 ? (
                                        <div className="space-y-2 max-h-[300px] overflow-y-auto pr-2">
                                            {reviewList.map((item, index) => (
                                                <div key={index} className={`p-3 rounded-xl border text-sm ${item.isTarget ? 'bg-rose-50 border-rose-200' : 'bg-amber-50 border-amber-200'}`}>
                                                    <p className="font-bold text-slate-800">{item.text}</p>
                                                    {item.isTarget ? (
                                                        <div className="mt-1.5 flex items-center gap-2 flex-wrap">
                                                            <span className="bg-rose-500 text-white text-xs px-2 py-0.5 rounded font-bold">{item.action === 'missed' ? '놓침' : '잘못된 표현'}</span>
                                                            <span className="text-emerald-600 font-bold">✅ 올바른 표현: {item.fix}</span>
                                                        </div>
                                                    ) : <p className="text-xs mt-1 text-amber-600 font-bold">✅ 올바른 피동 표현인데 쏴버렸어요.</p>}
                                                </div>
                                            ))}
                                        </div>
                                    ) : <div className="text-center font-bold text-slate-400 py-4">🎉 완벽합니다! 실수가 없네요.</div>}
                                </div>

                                {/* 다운로드 버튼 */}
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">
                                    <button onClick={generateWrongNote} className="py-3 bg-gradient-to-r from-rose-500 to-pink-500 text-white rounded-xl font-bold shadow-lg hover:shadow-xl transition-all active:scale-95 text-sm">
                                        📝 오답노트 JPG 저장
                                    </button>
                                    <button onClick={generateReport} className="py-3 bg-gradient-to-r from-purple-500 to-indigo-500 text-white rounded-xl font-bold shadow-lg hover:shadow-xl transition-all active:scale-95 text-sm">
                                        📊 학습 리포트 JPG 저장
                                    </button>
                                </div>

                                {/* 개인정보 + 메인으로 */}
                                <p className="text-xs text-slate-400 text-center mb-4">
                                    🔒 입력하신 이름과 소감은 서버에 저장되지 않으며, 리포트 이미지(JPG) 생성용으로만 쓰입니다.
                                </p>
                                <div className="flex gap-3 justify-center">
                                    <button onClick={() => { setScene('start'); }} className="px-8 py-3 bg-slate-100 text-slate-600 rounded-xl font-bold hover:bg-slate-200 transition-all active:scale-95">🏠 메인으로</button>
                                    <button onClick={() => { setDifficulty(difficulty); handleStart(difficulty); }} className="px-8 py-3 bg-gradient-to-r from-purple-500 to-pink-500 text-white rounded-xl font-bold shadow-lg hover:shadow-xl transition-all active:scale-95">🔄 다시 도전</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
