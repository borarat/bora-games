  const JONG_LIST=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const ci=CHO.indexOf(cho),ji=JUNG.indexOf(jung),ki=JONG_LIST.indexOf(jong===''?'':jong);
  if(ci<0||ji<0||ki<0)return'?';
  return String.fromCharCode(0xAC00+ci*21*28+ji*28+ki);
}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

let audioCtx;
function getAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx}
function playCorrectSound(){try{const c=getAudio(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.setValueAtTime(523,c.currentTime);o.frequency.setValueAtTime(659,c.currentTime+.1);o.frequency.setValueAtTime(784,c.currentTime+.2);g.gain.setValueAtTime(.3,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.5);o.start(c.currentTime);o.stop(c.currentTime+.5)}catch(e){}}
function playWrongSound(){try{const c=getAudio(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sawtooth';o.frequency.setValueAtTime(220,c.currentTime);o.frequency.setValueAtTime(180,c.currentTime+.15);g.gain.setValueAtTime(.25,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.4);o.start(c.currentTime);o.stop(c.currentTime+.4)}catch(e){}}
function playComboSound(){try{const c=getAudio();[523,659,784,1047].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.2,c.currentTime+i*.08);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+i*.08+.25);o.start(c.currentTime+i*.08);o.stop(c.currentTime+i*.08+.25)})}catch(e){}}

function App(){
  const [gameState,setGameState]=useState('start');
  const [level,setLevel]=useState(1);
  const [placedVowels,setPlacedVowels]=useState({});
  const [placedLabels,setPlacedLabels]=useState({});
  const [placedConsonants,setPlacedConsonants]=useState({});
  const [shuffledCards,setShuffledCards]=useState([]);
  const [selectedCard,setSelectedCard]=useState(null);
  const [message,setMessage]=useState(null);
  // 1~3단계 오답 기록: {카드id: 틀린횟수}
  const [wrongCounts,setWrongCounts]=useState({});

  // 4단계
  const [l4Order,setL4Order]=useState([]);
  const [l4Pos,setL4Pos]=useState(0);
  const [l4Step,setL4Step]=useState('cho');
  const [l4Selected,setL4Selected]=useState({cho:null,jung:null,jong:null});
  const [l4Results,setL4Results]=useState({});
  const [l4Score,setL4Score]=useState(0);
  const [l4Combo,setL4Combo]=useState(0);
  const [l4MaxCombo,setL4MaxCombo]=useState(0);
  const [l4Feedback,setL4Feedback]=useState(null);
  const [l4Locked,setL4Locked]=useState(false);
  const [l4WrongParts,setL4WrongParts]=useState({cho:false,jung:false,jong:false});

  const LEVEL2_LABELS=useMemo(()=>[
    {id:'pos-1',text:'전설 모음 (앞)',type:'pos',target:'전설'},{id:'pos-2',text:'후설 모음 (뒤)',type:'pos',target:'후설'},
    {id:'height-1',text:'고모음',type:'height',target:'고모음'},{id:'height-2',text:'중모음',type:'height',target:'중모음'},{id:'height-3',text:'저모음',type:'height',target:'저모음'},
    {id:'shape-1',text:'평순모음',type:'shape',target:'평순모음(전설)'},{id:'shape-2',text:'원순모음',type:'shape',target:'원순모음(전설)'},
    {id:'shape-3',text:'평순모음',type:'shape',target:'평순모음(후설)'},{id:'shape-4',text:'원순모음',type:'shape',target:'원순모음(후설)'},
  ],[]);
  useEffect(()=>{if(window.lucide)window.lucide.createIcons()});

  const getQAtPos=(pos)=>LEVEL4_QUESTIONS[l4Order[pos]];
  const getResult=(qId)=>l4Results[qId]||{status:null,attempts:0};

  const startGame=(selectedLevel)=>{
    setLevel(selectedLevel);setPlacedVowels({});setPlacedLabels({});setPlacedConsonants({});
    setSelectedCard(null);setGameState('playing');setMessage(null);setWrongCounts({});
    if(selectedLevel===1){const chars=VOWEL_DATA.map(v=>v.char);setShuffledCards([...chars].sort(()=>Math.random()-.5).map(c=>({id:c,text:c})))}
    else if(selectedLevel===2){setShuffledCards([...LEVEL2_LABELS].sort(()=>Math.random()-.5))}
    else if(selectedLevel===3){const chars=CONSONANT_DATA.map(c=>c.char);setShuffledCards([...chars].sort(()=>Math.random()-.5).map(c=>({id:c,text:c})))}
    else if(selectedLevel===4){
      const order=shuffle(Array.from({length:TOTAL_Q},(_,i)=>i));
      setL4Order(order);setL4Pos(0);setL4Step('cho');setL4Selected({cho:null,jung:null,jong:null});
      setL4Results({});setL4Score(0);setL4Combo(0);setL4MaxCombo(0);
      setL4Feedback(null);setL4Locked(false);setL4WrongParts({cho:false,jung:false,jong:false});
    }
  };

  // 1~3단계 핸들러 (동일)
  const handleCardClick=(card)=>{if(level===1&&placedVowels[card.id])return;if(level===2&&placedLabels[card.id])return;if(level===3&&placedConsonants[card.id])return;setSelectedCard(card)};
  const handleSlotClick=(pos,height,shape)=>{if(level!==1||!selectedCard)return;const tv=VOWEL_DATA.find(v=>v.char===selectedCard.text);if(tv&&tv.position===pos&&tv.height===height&&tv.shape===shape){setPlacedVowels(p=>({...p,[selectedCard.id]:pos+'-'+height+'-'+shape}));setShuffledCards(p=>p.filter(c=>c.id!==selectedCard.id));setSelectedCard(null);setMessage({text:'딩동댕! ✨',type:'success'});setTimeout(()=>setMessage(null),1500)}else{setWrongCounts(w=>({...w,[selectedCard.id]:(w[selectedCard.id]||0)+1}));setMessage({text:'다시 한번 생각해보세요! 💡',type:'error'});setTimeout(()=>setMessage(null),1500)}};
  const handleLabelSlotClick=(type,value)=>{if(level!==2||!selectedCard||placedLabels[value])return;let ok=false;if(type==='pos'&&selectedCard.target===value)ok=true;if(type==='height'&&selectedCard.target===value)ok=true;if(type==='shape'){if(selectedCard.text==='평순모음'&&value.startsWith('평순모음'))ok=true;else if(selectedCard.text==='원순모음'&&value.startsWith('원순모음'))ok=true;else if(selectedCard.target===value)ok=true}if(ok){setPlacedLabels(p=>({...p,[value]:true}));setShuffledCards(p=>p.filter(c=>c.id!==selectedCard.id));setSelectedCard(null);setMessage({text:'딩동댕! ✨',type:'success'});setTimeout(()=>setMessage(null),1500)}else{setWrongCounts(w=>({...w,[selectedCard.id]:(w[selectedCard.id]||0)+1}));setMessage({text:'위치가 틀렸어요! 💡',type:'error'});setTimeout(()=>setMessage(null),1500)}};
  const handleConsonantSlotClick=(place,manner,type)=>{if(level!==3||!selectedCard)return;const tc=CONSONANT_DATA.find(c=>c.char===selectedCard.text);if(tc&&tc.place===place&&tc.manner===manner&&tc.type===type){const sid=place+'-'+manner+'-'+(type||'none');setPlacedConsonants(p=>({...p,[selectedCard.id]:sid}));setShuffledCards(p=>p.filter(c=>c.id!==selectedCard.id));setSelectedCard(null);setMessage({text:'딩동댕! ✨',type:'success'});setTimeout(()=>setMessage(null),1500)}else{setWrongCounts(w=>({...w,[selectedCard.id]:(w[selectedCard.id]||0)+1}));setMessage({text:'위치를 다시 생각해보세요! 💡',type:'error'});setTimeout(()=>setMessage(null),1500)}};

  // === 4단계 핸들러 ===
  const loadQuestion=(pos)=>{
    const q=LEVEL4_QUESTIONS[l4Order[pos]];
    const r=getResult(q.id);
    setL4Pos(pos);setL4WrongParts({cho:false,jung:false,jong:false});setL4Feedback(null);
    if(r.status==='correct'||r.status==='giveup'){
      setL4Locked(true);setL4Step('cho');
      setL4Selected(r.status==='correct'?{cho:q.answer.cho,jung:q.answer.jung,jong:q.answer.jong}:{cho:r.userCho||q.answer.cho,jung:r.userJung||q.answer.jung,jong:r.userJong||q.answer.jong});
      setL4Feedback(r.status==='correct'?{type:'correct',text:`정답! "${q.word}"`}:{type:'giveup',text:`정답: "${q.word}" (${q.answer.cho}+${q.answer.jung}+${q.answer.jong==='ㅇ'?'ㅇ':q.answer.jong||'없음'})`});
    } else {
      setL4Locked(false);setL4Step('cho');setL4Selected({cho:null,jung:null,jong:null});
    }
  };
  const handleL4Nav=(dir)=>{const np=l4Pos+dir;if(np<0||np>=TOTAL_Q)return;loadQuestion(np)};

  const handleL4ConsonantClick=(char)=>{
    if(l4Locked||l4Step==='jung')return;
    setL4WrongParts({cho:false,jung:false,jong:false});setL4Feedback(null);
    const newSel={...l4Selected,[l4Step]:char};setL4Selected(newSel);
    if(l4Step==='cho')setL4Step('jung');
    else if(l4Step==='jong')setTimeout(()=>handleL4Check(newSel),300);
  };
  const handleL4VowelClick=(char)=>{
    if(l4Locked||l4Step!=='jung')return;
    setL4WrongParts({cho:false,jung:false,jong:false});setL4Feedback(null);
    setL4Selected(prev=>({...prev,jung:char}));setL4Step('jong');
  };
  const handleL4NoJong=()=>{
    if(l4Locked||l4Step!=='jong')return;
    setL4WrongParts({cho:false,jung:false,jong:false});setL4Feedback(null);
    const newSel={...l4Selected,jong:''};setL4Selected(newSel);
    setTimeout(()=>handleL4Check(newSel),300);
  };
  const handleL4Deselect=(part)=>{
    if(l4Locked)return;
    setL4WrongParts({cho:false,jung:false,jong:false});setL4Feedback(null);
    setL4Selected(prev=>({...prev,[part]:null}));setL4Step(part);
  };

  const handleL4Check=(sel)=>{
    const q=getQAtPos(l4Pos);const r=getResult(q.id);
    const choOk=sel.cho===q.answer.cho,jungOk=sel.jung===q.answer.jung,jongOk=sel.jong===q.answer.jong;
    if(choOk&&jungOk&&jongOk){
      playCorrectSound();setL4Locked(true);
      const nc=l4Combo+1,bonus=nc>=5?10:nc>=3?5:0,pts=10+bonus;
      setL4Score(s=>s+pts);setL4Combo(nc);if(nc>l4MaxCombo)setL4MaxCombo(nc);if(nc>=3)playComboSound();
      setL4Feedback({type:'correct',text:`정답! "${q.word}" (+${pts}점${bonus>0?' 콤보 보너스!':''})`});
      setL4WrongParts({cho:false,jung:false,jong:false});
      setL4Results(prev=>({...prev,[q.id]:{status:'correct',attempts:(r.attempts||0)+1,userCho:sel.cho,userJung:sel.jung,userJong:sel.jong}}));
    } else {
      playWrongSound();const na=(r.attempts||0)+1;
      setL4WrongParts({cho:!choOk,jung:!jungOk,jong:!jongOk});
      if(na>=3){
        setL4Locked(true);setL4Combo(0);
        setL4Feedback({type:'giveup',text:`3회 오답! 정답은 "${q.word}" (${q.answer.cho}+${q.answer.jung}+${q.answer.jong||'없음'})`});
        setL4Results(prev=>({...prev,[q.id]:{status:'giveup',attempts:na,userCho:sel.cho,userJung:sel.jung,userJong:sel.jong}}));
      } else {
        const wn=[];if(!choOk)wn.push('초성');if(!jungOk)wn.push('중성');if(!jongOk)wn.push('종성');
        setL4Feedback({type:'wrong',text:`${wn.join(', ')}이(가) 틀렸어요! 다시 선택해보세요. (${na}/3회)`});
        const ns={...sel};if(!choOk)ns.cho=null;if(!jungOk)ns.jung=null;if(!jongOk)ns.jong=null;
        setL4Selected(ns);setL4Step(!choOk?'cho':!jungOk?'jung':'jong');
        setL4Results(prev=>({...prev,[q.id]:{status:null,attempts:na}}));
      }
    }
  };

  const handleL4Finish=()=>{
    // 미답 문제는 giveup 처리
    const newR={...l4Results};
    l4Order.forEach(idx=>{const q=LEVEL4_QUESTIONS[idx];if(!newR[q.id]||!newR[q.id].status)newR[q.id]={status:'skipped',attempts:0}});
    setL4Results(newR);
    if(window.confetti)window.confetti({particleCount:150,spread:70,origin:{y:.6}});
    setTimeout(()=>setGameState('finished'),500);
  };

  useEffect(()=>{
    if(gameState==='playing'&&level<=3){
      const done=level===1?Object.keys(placedVowels).length===10:level===2?Object.keys(placedLabels).length===9:Object.keys(placedConsonants).length===19;
      if(done){if(window.confetti)window.confetti({particleCount:150,spread:70,origin:{y:.6},colors:['#A7F3D0','#FBCFE8','#BAE6FD','#FDE68A']});const t=setTimeout(()=>setGameState('finished'),3000);return()=>clearTimeout(t)}
    }
  },[placedVowels,placedLabels,placedConsonants,gameState,level]);

  // --- 4단계 체계표 ---
  const VowelChart4=()=>{
    const isActive=l4Step==='jung'&&!l4Locked;
    return(<div class={'rounded-xl border-2 p-2 transition-all '+(isActive?'border-blue-400 bg-blue-50/30':'border-slate-200 bg-white')}>
      <div class="text-center font-bold text-xs mb-1" style={{color:isActive?'#3b82f6':'#64748b'}}>{isActive?'👇 여기서 중성을 선택하세요':'📊 단모음 체계표'}</div>
      <table style={{borderCollapse:'collapse',width:'100%'}}><thead><tr>
        <td class="l4-chart-cell l4-label" rowSpan="2" style={{fontSize:'10px',width:'40px'}}>혀의<br/>높낮이</td>
        <td class="l4-chart-cell l4-label" colSpan="2" style={{background:'#dbeafe'}}>전설 모음</td>
        <td class="l4-chart-cell l4-label" colSpan="2" style={{background:'#fce7f3'}}>후설 모음</td>
      </tr><tr><td class="l4-chart-cell l4-label" style={{fontSize:'10px'}}>평순</td><td class="l4-chart-cell l4-label" style={{fontSize:'10px'}}>원순</td>
        <td class="l4-chart-cell l4-label" style={{fontSize:'10px'}}>평순</td><td class="l4-chart-cell l4-label" style={{fontSize:'10px'}}>원순</td></tr></thead>
      <tbody>{HEIGHTS.map(h=>(<tr key={h}><td class="l4-chart-cell l4-label">{h}모음</td>
        {POSITIONS.map(p=>SHAPES.map(s=>{const v=VOWEL_DATA.find(vd=>vd.position===p&&vd.height===h&&vd.shape===s);
          if(!v)return<td key={p+s} class="l4-chart-cell l4-empty" style={{color:'#cbd5e1',fontSize:'12px'}}>✕</td>;
          const sel=l4Selected.jung===v.char;
          return(<td key={p+s} class={'l4-chart-cell '+(sel?'l4-selected':'')+(isActive?' l4-active-hint':'')+(!isActive?' l4-inactive':'')} onClick={()=>isActive&&handleL4VowelClick(v.char)}>{v.char}</td>)}))}</tr>))}</tbody></table></div>);
  };
  const ConsonantChart4=()=>{
    const isActive=(l4Step==='cho'||l4Step==='jong')&&!l4Locked;const sl=l4Step==='cho'?'초성':'종성';
    return(<div class={'rounded-xl border-2 p-2 transition-all '+(isActive?'border-blue-400 bg-blue-50/30':'border-slate-200 bg-white')}>
      <div class="text-center font-bold text-xs mb-1" style={{color:isActive?'#3b82f6':'#64748b'}}>{isActive?`👇 여기서 ${sl}을 선택하세요`:'📊 자음 체계표'}</div>
      <table style={{borderCollapse:'collapse',width:'100%'}}><thead><tr>
        <td class="l4-chart-cell l4-label" colSpan="2" style={{fontSize:'9px'}}>소리 내는 방법<br/>\ 위치</td>
        {CONSONANT_PLACES.map(p=>(<td key={p} class="l4-chart-cell l4-label" style={{fontSize:'9px',lineHeight:'1.2'}}>{p.replace('소리','')}</td>))}</tr></thead>
      <tbody>{CONSONANT_MANNERS.map(m=>m.types.map((type,tIdx)=>(<tr key={m.name+'-'+(type||'none')}>
        {tIdx===0&&(<td class="l4-chart-cell l4-label" rowSpan={m.types.length} style={{fontSize:'10px',width:'38px'}}>{m.name}</td>)}
        <td class="l4-chart-cell l4-label" style={{fontSize:'9px',width:'32px'}}>{type?type.replace('소리',''):''}</td>
        {CONSONANT_PLACES.map(place=>{const cd=CONSONANT_DATA.find(c=>c.place===place&&c.manner===m.name&&c.type===type);
          if(!cd)return<td key={place} class="l4-chart-cell l4-empty"></td>;
          const sel=(l4Step==='cho'&&l4Selected.cho===cd.char)||(l4Step==='jong'&&l4Selected.jong===cd.char)||(l4Step!=='cho'&&l4Step!=='jong'&&(l4Selected.cho===cd.char||l4Selected.jong===cd.char));
          return(<td key={place} class={'l4-chart-cell '+(sel?'l4-selected':'')+(isActive?' l4-active-hint':'')+(!isActive?' l4-inactive':'')} onClick={()=>isActive&&handleL4ConsonantClick(cd.char)}>{cd.char}</td>)})}</tr>)))}</tbody></table>
      {/* 종성 없음 버튼 */}
      {l4Step==='jong'&&!l4Locked&&(
        <div class="text-center mt-2"><button class={'no-jong-btn '+(l4Step==='jong'?'active-hint':'')+(l4Selected.jong===''?' selected':'')} onClick={handleL4NoJong}>✖️ 종성 없음 (받침 없는 글자)</button></div>
      )}
    </div>);
  };

  return(
    <div class="relative max-w-[1400px] mx-auto">
      <div class="fixed inset-0 pointer-events-none overflow-hidden opacity-20"><div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-mint-200 blur-3xl"/><div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-pink-200 blur-3xl"/></div>

      {/* START */}
      {gameState==='start'&&(

            <div class="text-left">

              <p class="text-slate-500 text-sm">단모음·자음 체계표를 직접 완성하고, 음운 설명으로 단어를 찾아보세요!</p>

            {/* 성취기준 */}
            <div class="bg-indigo-50 border border-indigo-200 rounded-xl p-3 mb-5 text-sm text-indigo-800 font-bold text-center">[9국04-10] 음운 체계를 알고, 한글의 자모 체계와 관련지어 이해한다.</div>
            {/* 게임 설명 */}
            <div class="flex items-start gap-4 mb-5">
              <div class="text-4xl shrink-0">🔍</div>
              <div class="text-slate-600 text-[15px] leading-7">
                <strong class="text-slate-800">단모음 체계표</strong>와 <strong class="text-slate-800">자음 체계표</strong>를 직접 완성해보고, 4단계에서는 음운의 설명을 읽고 <strong class="text-slate-800">초성·중성·종성을 찾아 1음절 단어를 완성</strong>하세요. 문제는 출제할 때마다 순서가 바뀝니다.
              </div>
            </div>
            {/* 게임 방법 */}
            <div class="bg-sky-50 border border-sky-200 rounded-xl p-4 mb-5">
              <h3 class="font-extrabold text-sky-800 mb-2 text-sm">📖 게임 방법</h3>
              <div class="text-sm text-sky-700 leading-6">
                <strong>1~3단계</strong>: 카드를 클릭한 뒤 체계표의 올바른 빈칸에 배치합니다.<br/>
                <strong>4단계</strong>: 초성·중성·종성에 대한 설명을 읽고, 체계표에서 해당 음운을 찾아 클릭합니다. 세 개를 모두 찾으면 1음절 단어가 완성됩니다. 3회 오답 시 정답이 공개됩니다.
              </div>
            </div>
            {/* 점수 안내 */}
            <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 mb-5">
              <h3 class="font-extrabold text-amber-800 mb-2 text-sm">🏅 점수 규칙 (4단계)</h3>
              <div class="text-sm text-amber-700 leading-6">정답 +10점 · 3연속 콤보 보너스 +5점 · 5연속 콤보 보너스 +10점</div>
            </div>
            {/* 단계 선택 */}
            <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 mb-5">
              <h3 class="font-extrabold text-slate-700 mb-3 text-sm">🎯 단계를 선택하세요</h3>
              <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                <button onClick={()=>startGame(1)} class="py-4 bg-gradient-to-br from-teal-400 to-cyan-500 text-white rounded-xl font-bold shadow-md hover:shadow-lg hover:-translate-y-0.5 transition-all active:scale-95 text-center"><div class="text-xl mb-1">📊</div><div class="text-sm">1단계 · 기본</div><div class="text-[11px] opacity-80 mt-1">단모음 배치하기</div></button>
                <button onClick={()=>startGame(2)} class="py-4 bg-gradient-to-br from-sky-400 to-blue-500 text-white rounded-xl font-bold shadow-md hover:shadow-lg hover:-translate-y-0.5 transition-all active:scale-95 text-center"><div class="text-xl mb-1">🏷️</div><div class="text-sm">2단계 · 심화</div><div class="text-[11px] opacity-80 mt-1">특징 라벨 배치</div></button>
                <button onClick={()=>startGame(3)} class="py-4 bg-gradient-to-br from-pink-400 to-rose-500 text-white rounded-xl font-bold shadow-md hover:shadow-lg hover:-translate-y-0.5 transition-all active:scale-95 text-center"><div class="text-xl mb-1">🔤</div><div class="text-sm">3단계 · 심화</div><div class="text-[11px] opacity-80 mt-1">자음 배치하기</div></button>
                <button onClick={()=>startGame(4)} class="py-4 bg-gradient-to-br from-purple-500 to-violet-600 text-white rounded-xl font-bold shadow-md hover:shadow-lg hover:-translate-y-0.5 transition-all active:scale-95 text-center ring-2 ring-purple-300 ring-offset-2"><div class="text-xl mb-1">🎯</div><div class="text-sm">4단계 · 적용</div><div class="text-[11px] opacity-80 mt-1">단어 찾기 13문제</div></button>
              </div>
            </div>
            {/* 크레딧 */}

                <h3 class="font-extrabold text-indigo-800 mb-3 text-sm">✏️ 이름과 학습 소감을 입력하세요</h3>
                <div class="flex gap-3 mb-3">
                  <div class="flex-1"><label class="text-xs font-bold text-indigo-600 mb-1 block">이름 (닉네임) *</label><input id="nickname-input" type="text" placeholder="닉네임을 입력하세요" class="w-full border border-indigo-300 rounded-lg px-3 py-2 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-indigo-400"/></div>
                </div>
                <div><label class="text-xs font-bold text-indigo-600 mb-1 block">학습 소감</label><textarea id="feeling-input" rows="2" placeholder="오늘 학습한 소감을 적어주세요" class="w-full border border-indigo-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"></textarea></div>
                <div class="text-[11px] text-indigo-400 mt-2">입력하신 이름과 소감은 서버에 저장되지 않으며, 리포트 이미지(JPG) 생성용으로만 쓰입니다.</div>
              </div>

              {/* 다운로드 버튼들 */}
              <div class="grid grid-cols-2 gap-3 mb-5">
                <button onClick={generateWrongNote} class="py-3 bg-gradient-to-r from-red-400 to-rose-500 text-white rounded-xl font-bold shadow-md hover:shadow-lg transition-all active:scale-95 text-sm">📝 오답노트 JPG 다운로드</button>
                <button onClick={generateReport} class="py-3 bg-gradient-to-r from-indigo-500 to-purple-500 text-white rounded-xl font-bold shadow-md hover:shadow-lg transition-all active:scale-95 text-sm">📊 학습 리포트 JPG 다운로드</button>
              </div>

              {/* 오답 목록 화면 표시 */}
              {wrongItems.length===0?(<div class="bg-green-50 border border-green-200 rounded-xl p-4 text-green-800 font-bold text-center mb-5">🎊 모든 문제를 맞혔어요!</div>):(
                <div class="text-left mb-5"><h3 class="text-base font-extrabold text-slate-800 mb-3 pb-2 border-b-2 border-red-100">❌ 틀린 문제 다시 보기 ({wrongItems.length}문제)</h3>
                  {wrongItems.map(({q,r})=>(<div key={q.id} class="bg-red-50 border border-red-200 rounded-xl p-4 mb-3">
                    <div class="text-sm font-bold text-red-600 mb-1">{q.word}{r.status==='skipped'?' (건너뜀)':''}</div>
                    {r.userCho&&(<div class="text-sm text-slate-600 mb-2"><span class="font-bold">내 답:</span> {r.userCho}+{r.userJung}+{(r.userJong===''?'없음':r.userJong)||'없음'} = {combineSyllable(r.userCho,r.userJung,r.userJong||'')}</div>)}
                    <div class="text-sm text-green-700 font-bold">✅ 정답: {q.answer.cho}+{q.answer.jung}+{(q.answer.jong===''?'없음':q.answer.jong)||'없음'} = {q.word}</div>
                  </div>))}
                </div>
              )}

              {/* 하단 버튼 */}
              <div class="flex gap-3">
                <button onClick={()=>setGameState('start')} class="flex-1 py-3 bg-green-100 border border-green-300 text-green-800 rounded-xl font-bold hover:bg-green-200 transition-all active:scale-95">🏠 단계 선택으로</button>
                <button onClick={()=>startGame(4)} class="flex-1 py-3 bg-gradient-to-r from-purple-500 to-pink-500 text-white rounded-xl font-bold shadow-lg hover:shadow-xl transition-all active:scale-95">🔄 다시 풀기</button>
              </div>
            </div>
          </div>
        );
      })()}

      <div class="mt-12 mb-8 text-center"><p class="text-slate-400 font-medium italic text-sm">제작 · 보라라샘 · 전주서신중학교 교사 · siaawase@gmail.com</p></div>
    </div>
  );
}
const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
