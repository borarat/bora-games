<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>보라라랩 국어 에듀테크 연구소</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hero {
            text-align: center;
            padding: 2rem;
            max-width: 700px;
        }
        .logo {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        .hero h1 {
            font-size: 2.4rem;
            margin-bottom: 0.6rem;
            line-height: 1.3;
        }
        .hero .subtitle {
            font-size: 1.15rem;
            opacity: 0.85;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }
        .menu {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
        }
        .menu a {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: rgba(255,255,255,0.18);
            backdrop-filter: blur(10px);
            color: #fff;
            text-decoration: none;
            padding: 1rem 1.8rem;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 500;
            transition: transform 0.2s, background 0.2s;
        }
        .menu a:hover {
            transform: translateY(-3px);
            background: rgba(255,255,255,0.3);
        }
        .menu a .icon { font-size: 1.4rem; }
        .stats {
            margin-top: 2.5rem;
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            opacity: 0.8;
        }
        .stats .stat { text-align: center; }
        .stats .num { font-size: 1.8rem; font-weight: 700; }
        .stats .label { font-size: 0.85rem; opacity: 0.8; }
        .footer {
            position: fixed;
            bottom: 1rem;
            width: 100%;
            text-align: center;
            font-size: 0.8rem;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="logo">🔬</div>
        <h1>보라라랩<br>국어 에듀테크 연구소</h1>
        <p class="subtitle">게임으로 배우는 국어, 즐겁게 성장하는 학습</p>
        <div class="menu">
            <a href="games.html">
                <span class="icon">🎮</span>
                게임 모음
            </a>
        </div>
        <div class="stats">
            <div class="stat">
                <div class="num">19</div>
                <div class="label">게임</div>
            </div>
            <div class="stat">
                <div class="num">4</div>
                <div class="label">영역</div>
            </div>
            <div class="stat">
                <div class="num">5</div>
                <div class="label">성취기준</div>
            </div>
        </div>
    </div>
    <div class="footer">
        보라라랩 국어 에듀테크 연구소 &middot; Powered by GitHub Pages
    </div>
</body>
</html>
