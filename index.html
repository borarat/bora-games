<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>보라의 게임 모음 | Bora Games</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        p {
            font-size: 1.2rem;
            opacity: 0.85;
            margin-bottom: 2rem;
        }
        .game-list {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 2rem;
            max-width: 500px;
            margin: 0 auto;
        }
        .game-list h2 {
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }
        .game-list p.empty {
            opacity: 0.7;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>보라의 게임 모음</h1>
        <p>리모델링된 HTML 게임들을 여기서 플레이하세요!</p>
        <div class="game-list">
            <h2>게임 목록</h2>
            <p class="empty">아직 게임이 업로드되지 않았어요. 곧 추가될 예정입니다!</p>
        </div>
    </div>
</body>
</html>
