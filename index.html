  <title>보라라랩 국어 에듀테크 연구소</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&amp;family=Jua&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #24324a;
      --coral: #e56b5d;
      --blue: #7c3aed;
      --mint: #c9f2e5;
      --cream: #fff8ee;
      --lemon: #f7d774;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      margin: 0;
      overflow-x: hidden;
      font-family: "Jua", sans-serif;
      color: var(--ink);
    }

    .app-wrapper {
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      position: relative;
      isolation: isolate;
      overflow: hidden;
    }

    .paper-grain {
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: .42;
      pointer-events: none;
      background-image:
        radial-gradient(rgba(39, 50, 74, .14) .7px, transparent .7px),
        radial-gradient(rgba(39, 50, 74, .08) .7px, transparent .7px);
      background-size: 17px 17px, 23px 23px;
      background-position: 0 0, 9px 11px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.6), transparent 88%);
    }

    .shape {
      position: absolute;
      z-index: -1;
      pointer-events: none;
      animation: drift 8s ease-in-out infinite;
    }

    .shape-mint {
      width: 31rem;
      height: 28rem;
      top: -13rem;
      left: -10rem;
      border-radius: 48% 52% 36% 64% / 53% 43% 57% 47%;
      background: var(--mint);
      transform: rotate(-12deg);
    }

    .shape-coral {
      width: 22rem;
      height: 22rem;
      right: -9rem;
      bottom: -8rem;
      border-radius: 61% 39% 59% 41% / 44% 58% 42% 56%;
      background: #f6b6a9;
      animation-delay: -3s;
    }

    .shape-lemon {
      width: 9.5rem;
      height: 9.5rem;
      top: 10%;
      right: 13%;
      border-radius: 48% 52% 60% 40% / 43% 56% 44% 57%;
      background: var(--lemon);
      transform: rotate(18deg);
      animation-delay: -1.2s;
    }

    .dot-cluster {
      position: absolute;
      left: 7%;
      bottom: 13%;
      z-index: -1;
      width: 84px;
      height: 60px;
      background-image: radial-gradient(var(--blue) 2.5px, transparent 3px);
      background-size: 17px 17px;
      transform: rotate(-12deg);
      opacity: .85;
    }

    @keyframes drift {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 12px; }
    }

    .site-header {
      width: 100%;
      padding: 1.5rem clamp(1.5rem, 5vw, 5rem) 0;
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      color: var(--ink);
      font-family: "Gaegu", cursive;
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: .02em;
      transform: rotate(-2deg);
    }

    .brand-dot {
      width: .72rem;
      height: .72rem;
      display: inline-block;
      border-radius: 999px;
      background: var(--coral);
      box-shadow: .32rem .24rem 0 var(--lemon);
    }

    .hero-area {
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh) - 7.5rem);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(2.5rem, 5vw, 5rem) 1.5rem 2rem;
    }

    .hero-content {
      width: 100%;
      max-width: 900px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: rise-in .75s cubic-bezier(.2,.8,.2,1) both;
    }

    @keyframes rise-in {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .eyebrow-wrap {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      margin-bottom: 1.25rem;
      color: var(--blue);
      font-family: "Gaegu", cursive;
      font-size: clamp(1.25rem, 2.4vw, 1.75rem);
      font-weight: 700;
      transform: rotate(1.5deg);
    }

    .sparkle {
      color: var(--coral);
      font-size: 1.1em;
    }

    .headline {
      margin: 0;
      font-family: "Jua", sans-serif;
      font-weight: 400;
      line-height: 1.16;
      letter-spacing: -.035em;
      max-width: 850px;
    }

    .headline-line {
      display: block;
    }

    .headline-brand {
      color: var(--ink);
    }

    .headline-subject {
      display: inline-block;
      position: relative;
      color: var(--coral);
      z-index: 0;
      margin-right: .14em;
      transform: rotate(-3deg);
    }

    .headline-subject::after {
      content: "";
      position: absolute;
      left: -.05em;
      right: -.05em;
      bottom: .02em;
      height: .29em;
      z-index: -1;
      border-radius: 99px;
      background: var(--lemon);
      transform: rotate(-2deg);
    }

    .headline-lab {
      color: var(--blue);
    }

    .subtitle {
      margin: 1.85rem auto 0;
      max-width: 680px;
      color: var(--ink);
      font-family: "Gaegu", cursive;
      font-size: clamp(1.6rem, 3vw, 2.25rem);
      font-weight: 700;
      line-height: 1.42;
      letter-spacing: -.02em;
    }

    .emphasis-game,
    .emphasis-growth {
      display: inline-block;
      position: relative;
      z-index: 0;
    }

    .emphasis-game {
      color: var(--blue);
      transform: rotate(-2deg);
    }

    .emphasis-growth {
      color: #168b78;
      transform: rotate(2deg);
    }

    .emphasis-game::after,
    .emphasis-growth::after {
      content: "";
      position: absolute;
      left: -.08em;
      right: -.08em;
      bottom: .08em;
      height: .2em;
      z-index: -1;
      border-radius: 99px;
    }

    .emphasis-game::after { background: #b9d9ff; }
    .emphasis-growth::after { background: #b9ead7; }

    .cta-row {
      margin-top: 2.35rem;
      position: relative;
    }

    .cta-row::before,
    .cta-row::after {
      content: "✦";
      position: absolute;
      color: var(--coral);
      font-family: "Gaegu", cursive;
      font-size: 1.45rem;
      pointer-events: none;
    }

    .cta-row::before {
      left: -2.2rem;
      top: -1.1rem;
      transform: rotate(-18deg);
    }

    .cta-row::after {
      right: -2rem;
      bottom: -.85rem;
      color: var(--blue);
      transform: rotate(16deg);
    }

    .main-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .72rem;
      min-height: 3.9rem;
      padding: .95rem 1.75rem;
      border: 2px solid var(--ink);
      border-radius: 999px;
      text-decoration: none;
      box-shadow: 5px 6px 0 var(--ink);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .main-cta:hover {
      transform: translate(3px, 4px);
      box-shadow: 2px 2px 0 var(--ink);
    }

    .main-cta:focus-visible,
    .footer-link:focus-visible,
    .email-link:focus-visible {
      outline: 3px solid var(--blue);
      outline-offset: 4px;
    }

    .cta-icon {
      width: 1.25rem;
      height: 1.25rem;
      stroke-width: 2.8;
    }

    .contact-line {
      margin: 2.35rem 0 0;
      color: #5c6677;
      font-family: "Gaegu", cursive;
      font-size: 1.3rem;
      font-weight: 700;
    }

    .email-link {
      color: var(--blue);
      text-decoration-color: #a8c1ff;
      text-decoration-thickness: 2px;
      text-underline-offset: 4px;
    }

    .site-footer {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: .9rem;
      flex-wrap: wrap;
      padding: 0 1.5rem 1.6rem;
      color: #667083;
      font-family: "Gaegu", cursive;
      font-size: 1.05rem;
      font-weight: 700;
    }

    .footer-separator { color: var(--coral); }

    .footer-link {
      color: #667083;
      text-decoration: none;
      transition: color .2s ease;
    }

    .footer-link:hover { color: var(--blue); }

    @media (max-width: 640px) {
      .site-header { padding-top: 1.2rem; }

      .hero-area {
        min-height: calc(100 * min(var(--vh, 1vh), 1vh) - 5rem);
        padding-top: 2.8rem;
      }

      .headline { letter-spacing: -.045em; }

      .cta-row { width: min(100%, 320px); }

      .main-cta { width: 100%; }

      .shape-lemon {
        width: 6rem;
        height: 6rem;
        top: 13%;
        right: -1.5rem;
      }

      .dot-cluster {
        left: -1.5rem;
        bottom: 16%;
      }
    }
  </style>
