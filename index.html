<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>보라라랩 국어 에듀테크 연구소</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #fff;
        }
        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1.5rem;
        }
        .card {
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 3rem 3.5rem;
            max-width: 1040px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.18);

            display: flex;
            align-items: center;
            gap: 3.5rem;
        }

        /* ── 왼쪽: 마스코트 ── */
        .card-left {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mascot {
            height: 220px;
            width: auto;
            filter: drop-shadow(0 8px 20px rgba(0,0,0,0.25));
        }

        /* ── 오른쪽: 제목 · 설명 · 지표 · 버튼 ── */
        .card-right {
            flex: 1 1 auto;
            min-width: 0;
            text-align: left;
        }
        .title {
            font-size: 3rem;
            font-weight: 800;
            line-height: 1.25;
            letter-spacing: -0.02em;
            margin-bottom: 0.6rem;
        }
        .subtitle {
            font-size: 1.25rem;
            opacity: 0.88;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .stats {
            display: flex;
            gap: 2.8rem;
            margin-bottom: 2rem;
            opacity: 0.92;
        }
        .stat .num { font-size: 2rem; font-weight: 700; line-height: 1.2; }
        .stat .label { font-size: 0.9rem; opacity: 0.8; }

        .btn-group {
            display: flex;
            gap: 0.9rem;
            margin-bottom: 1.6rem;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            padding: 1rem 2.4rem;
            border-radius: 14px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 700;
            transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }
        .btn-primary {
            background: #fff;
            color: #5b4fa0;
        }
        .btn-primary:hover { background: #f0ecff; }
        .btn-secondary {
            background: rgba(255,255,255,0.18);
            color: #fff;
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.3); }
        .btn .icon { font-size: 1.3rem; }

        .divider {
            width: 72px;
            height: 2px;
            background: rgba(255,255,255,0.25);
            margin-bottom: 1.1rem;
            border-radius: 1px;
        }

        .contact-info {
            font-size: 0.9rem;
            opacity: 0.7;
        }
        .contact-info a {
            color: #fff;
            text-decoration: none;
        }
        .contact-info a:hover { text-decoration: underline; }

        .footer {
            margin-top: 1.6rem;
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            font-size: 0.8rem;
            opacity: 0.5;
        }
        .footer a {
            color: #fff;
            text-decoration: none;
        }
        .footer a:hover {
            opacity: 1;
            text-decoration: underline;
        }

        /* ── 태블릿 ── */
        @media (max-width: 900px) {
            .card { gap: 2.2rem; padding: 2.5rem 2rem; }
            .mascot { height: 200px; }
            .title { font-size: 2.3rem; }
            .subtitle { font-size: 1.1rem; margin-bottom: 1.5rem; }
            .stats { gap: 1.8rem; margin-bottom: 1.5rem; }
            .stat .num { font-size: 1.7rem; }
        }

        /* ── 모바일: 세로로 전환 ── */
        @media (max-width: 640px) {
            .card {
                flex-direction: column;
                gap: 1.2rem;
                padding: 2.2rem 1.4rem;
            }
            .card-right { text-align: center; }
            .mascot { height: 150px; }
            .title { font-size: 1.8rem; }
            .subtitle { font-size: 1rem; }
            .stats { justify-content: center; gap: 1.5rem; }
            .btn-group { flex-direction: column; }
            .btn { width: 100%; }
            .divider { margin-left: auto; margin-right: auto; }
        }
    </style>
</head>
